[package]
name = "deep_cfr"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "run_traversals"
path = "src/bin/run_traversals.rs"

[[bin]]
name = "measure_exploitability"
path = "src/bin/measure_exploitability.rs"

[[bin]]
name = "head_to_head"
path = "src/bin/head_to_head.rs"

[[bin]]
name = "ring_game_eval"
path = "src/bin/ring_game_eval.rs"

[[bin]]
name = "realtime_play"
path = "src/bin/realtime_play.rs"

[dependencies]
abstraction = { path = "../abstraction" }
cfr = { path = "../cfr" }
game = { path = "../game" }
ort = { version = "2.0.0-rc.11", default-features = false, features = ["load-dynamic", "ndarray"] }
ndarray = "0.17"
rand = "0.8"
rayon = "1.11"
crossbeam-channel = "0.5"
core_affinity = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6"
bincode = "1.3"
rs_poker = { version = "4.1.0", default-features = false }
